name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify Tag Matches App Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          content = Path('app/core/config.py').read_text(encoding='utf-8')
          match = re.search(r'app_version:\s*str\s*=\s*"([^"]+)"', content)
          if not match:
            raise SystemExit('Could not find app_version in app/core/config.py')
          print(match.group(1))
          PY
          )

          echo "Tag version: ${TAG_VERSION}"
          echo "App version: ${APP_VERSION}"

          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "Version mismatch: tag v${TAG_VERSION} != app_version ${APP_VERSION}"
            exit 1
          fi

  tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  publish-dockerhub:
    name: Publish Docker Hub Image
    runs-on: ubuntu-latest
    needs: tests
    if: vars.DOCKERHUB_IMAGE != '' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-gcr:
    name: Publish GCR Image
    runs-on: ubuntu-latest
    needs: tests
    if: vars.GCP_PROJECT_ID != '' && vars.GCR_IMAGE_NAME != '' && secrets.GCP_SA_KEY != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCR_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - tests
      - publish-dockerhub
      - publish-gcr
    if: always() && needs.tests.result == 'success' && (needs.publish-dockerhub.result == 'success' || needs.publish-dockerhub.result == 'skipped') && (needs.publish-gcr.result == 'success' || needs.publish-gcr.result == 'skipped')
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
